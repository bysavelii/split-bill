# nginx inside the container: it only serves the static files.
server {
    listen 8080;
    root /usr/share/nginx/html;

    # The container port is not visible behind the host's nginx: the redirect /ru → /ru/ must be relative.
    absolute_redirect off;

    gzip on;
    gzip_types text/css text/javascript application/javascript text/plain text/xml image/svg+xml;

    # Build files with a hash in the name never change, so they are cached forever.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # HTML is always revalidated, so a new deployment is visible at once.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
